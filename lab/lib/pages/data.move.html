<div>

	<h4>Jump</h4>

	<div class="wd-col">

		<dl id="myShelf">
			<dt>Shelf</dt>
			<dd data-wd-move="type{jump}$${#myShelf, #myBasket, #myRecycler}">Item 1</dd>
			<dd data-wd-move="type{jump}$${#myShelf, #myRecycler}">Item 2</dd>
			<dd data-wd-move="type{jump}$${#myShelf, #myBasket}">Item 3</dd>
		</dl>

		<dl id="myBasket">
			<dt>Basket</dt>
		</dl>

		<dl id="myRecycler">
			<dt>Recycler</dt>
		</dl>

	</div>

	<h4>Move</h4>

	<button type="button" data-wd-set="${#myMove}class{add{wd-open}}">Open</button>

	<div class="wd-window wd-flyer wd-bg-blue wd-radius" id="myMove">
		<header data-wd-move="type{move}${#myMove}" ><h4 id="myPoint">Move</h4></header>
		<p>Text Content. Text Content. Text Content. Text Content. Text Content. </p>
		<p>Text Content. Text Content. Text Content. Text Content. Text Content. </p>
		<button type="button" data-wd-set="${#myMove}class{remove{wd-open}}">Close</button>
	</div>

	<div style="height: 100px;" class="wd-border wd-fg-red">
		<span data-wd-move="type{move}" >Move me!</span>
	</div>


</div>
