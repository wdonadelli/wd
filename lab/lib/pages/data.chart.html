<section class="wd-flyer">

	<script>
		function sin(x) {return Math.sin(x);}
	</script>

	<nav>
		<span id="x"
			data-wd-set="${#source}value{path{lib/add-ons/chart.csv}method{GET}data[x{#0}y{#3}]}"
		>File</span>
		<span
			data-wd-set="${#source}value{${#table table}data[x{#0}y{#4},x{#0}y{#5}]}"
		>Table</span>
		<span
			data-wd-set="${#source}value{data[x[1,2,3]y[7,9,8]fit{minimum}label{test}]}"
		>Free</span>
		<span
			data-wd-set="${#source}value{data[x[-3.5,3.5]y(sin)label{test}]}"
		>Function</span>
		<span
			data-wd-set="${#source}value{ratio{true}data[x[A,B,C,D]y[5,7,2,8]]}"
		>Ratio</span>
		<span
			data-wd-set="${#source}value{${#table table}title{Velocity}xLabel{Time}yLabel{Space}xAxis{time}data[x{#2}y{#5}fit{minimum}]}"
		>xAxis</span>
	</nav>


	<div class="wd-form">
		<div><input type="text" id="source" /></div>
		<div><button type="button" onclick="toDataSet('#source', '#target', 'wdChart')">Ok</button></div>
	</div>


	<div id="target" data-wd-chart="path{lib/add-ons/chart.csv}data[x{#0}y{#3}]">XXXXX</div>

	<h4>Table</h4>

	<div id="table"></div>

	<h4>CSV</h4>

	<pre data-wd-load="path{lib/add-ons/chart.csv}method{GET}" class="wd-code"></pre>

	<script>
			loadTable(document.getElementById("table"), "lib/add-ons/chart.csv");
			//onInputDataSet("#wdDisplay", "#target", "wdDisplay");
	</script>

</section>
