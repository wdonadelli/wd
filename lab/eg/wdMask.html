<div>
	<h4>wdMask</h4>
	<p data-wd-mask="@model{###.###.###-##}" tabindex="0">12345678900</p>
	<p data-wd-mask="@model{###.###.###-##}" tabindex="0" contentEditable="true" >12345678900</p>
	<p data-wd-mask="@model{###.###.###-##}" tabindex="0" contentEditable="true">Digite aqui</p>

	<div><input type="text" data-wd-mask="@model{##/##/####}" value="12"/></div>
	<div><input type="text" data-wd-mask="@model{##/##/####}" value="10102010"/></div>
	<div><input type="text" data-wd-mask="@model{##/##/####}" value="10/10/2010"/></div>
	<div><input type="text" data-wd-mask="@model{## # #### ####?## #### ####}" value="10102010"/></div>
	<div><input type="date" data-wd-mask="@model{##/##/####}"/></div>
</div>
