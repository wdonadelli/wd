<div>
	<h4>wdMask</h4>
	<p data-wd-mask="@model{###.###.###-##}" tabindex="0">12345678900</p>
	<p data-wd-mask="@model{###.###.###-##}" tabindex="0" contentEditable="true" >12345678900</p>
	<p data-wd-mask="@model{###.###.###-##}" tabindex="0" contentEditable="true"></p>

	<div><input type="text" data-wd-mask="@model{##/##/####}"/></div>
	<div><input type="text" data-wd-mask="@model{##/##/####}" value="15/03/1983"/></div>
	<div><input type="date" data-wd-mask="@model{##/##/####}"/></div>
</div>
